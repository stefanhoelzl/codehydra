name: Build Distribution

on:
  workflow_call:
    inputs:
      release:
        description: "Use release versioning (YYYY.M.D or YYYY.M.D.N for same-day releases)"
        type: boolean
        default: false
    outputs:
      version:
        description: "The computed version string"
        value: ${{ jobs.prepare.outputs.version }}
      is_base_version:
        description: "Whether this is a base version (no .N suffix) for npm/PyPI"
        value: ${{ jobs.prepare.outputs.is_base_version }}

jobs:
  # Build and test on every OS. Each leg builds the native addon for its
  # platform, runs the whole suite against it — the process boundary tests load
  # exactly that file — and uploads it as `native-<os>`. `prepare` bundles those
  # files instead of building its own: it builds once on Linux and every package
  # job reuses its output, so it needs the addon of every platform, and taking
  # them from here means what ships is what these tests ran against. macOS
  # runners are arm64; the x86_64 addon is cross-built on the same runner (built,
  # not tested), so a run costs one macOS runner, not one per architecture.
  test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      # wrapper.boundary.test.ts executes dist/bin/*.cjs and throws without it,
      # the process boundary tests load dist/bin/codehydra-native.*.node (Rust comes from the setup action),
      # and server-manager.boundary.test.ts runs the hook handler built there.
      # The boundary globalSetup downloads the latest opencode once (ensure-binaries.ts).
      - run: pnpm build:wrappers

      - name: Cross-build the x86_64 macOS addon
        if: runner.os == 'macOS'
        shell: bash
        run: |
          (cd native && rustup target add x86_64-apple-darwin)
          node scripts/build-native.ts --target x86_64-apple-darwin

      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.os }}
          path: dist/bin/codehydra-native.*.node
          retention-days: 1
          if-no-files-found: error

      # server-manager.boundary.test.ts launches Claude for real, against a local
      # mock model — no login, no key, no network. It throws rather than skipping
      # when `claude` is absent, so a missing install fails the job instead of
      # silently dropping the coverage.
      #
      # Deliberately unpinned, like the e2e job: a release that changes which
      # hooks Claude emits should turn CI red here rather than go unnoticed.
      - name: Install the Claude CLI
        uses: ./.github/actions/install-claude

      - run: pnpm check
      - run: pnpm test
      - run: git diff --exit-code

      # Per-file and per-test durations (vitest's JSON reporter, CI only), for
      # finding slow files and tests running close to their timeout.
      - name: Upload test timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: vitest-timings-${{ matrix.os }}
          path: test-results/vitest.json
          retention-days: 14
          if-no-files-found: warn

  prepare:
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_base_version: ${{ steps.version.outputs.is_base_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ inputs.release }}" == "true" ]]; then
            # Format: YYYY.M.D (no leading zeros)
            YEAR=$(date -u +%Y)
            MONTH=$(date -u +%-m)
            DAY=$(date -u +%-d)
            BASE_VERSION="${YEAR}.${MONTH}.${DAY}"

            # Check for existing releases with this date
            # Escape dots for regex matching
            BASE_PATTERN="${BASE_VERSION//./\\.}"
            EXISTING=$(gh release list --repo "${{ github.repository }}" --json tagName --jq '.[].tagName' 2>/dev/null | grep -E "^v${BASE_PATTERN}(\.[0-9]+)?$" || true)

            if [[ -z "$EXISTING" ]]; then
              # No existing release for today
              VERSION="$BASE_VERSION"
            else
              # Find highest suffix
              MAX_SUFFIX=0
              for TAG in $EXISTING; do
                if [[ "$TAG" == "v${BASE_VERSION}" ]]; then
                  # Base version exists, need at least .1
                  [[ $MAX_SUFFIX -lt 1 ]] && MAX_SUFFIX=1
                elif [[ "$TAG" =~ ^v${BASE_PATTERN}\.([0-9]+)$ ]]; then
                  SUFFIX="${BASH_REMATCH[1]}"
                  [[ $SUFFIX -ge $MAX_SUFFIX ]] && MAX_SUFFIX=$((SUFFIX + 1))
                fi
              done
              VERSION="${BASE_VERSION}.${MAX_SUFFIX}"
            fi
            echo "version=$VERSION" >> $GITHUB_OUTPUT

            # Check if this is a base version (no .N suffix)
            if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "is_base_version=true" >> $GITHUB_OUTPUT
            else
              echo "is_base_version=false" >> $GITHUB_OUTPUT
            fi
          else
            DATE=$(git log -1 --format=%cd --date=format:'%Y.%-m.%-d')
            HASH=$(git rev-parse --short=8 HEAD)
            DIRTY=$(git status --porcelain | grep -q . && echo "-dirty" || echo "")
            echo "version=${DATE}-dev.${HASH}${DIRTY}" >> $GITHUB_OUTPUT
          fi

      - name: Setup
        uses: ./.github/actions/setup
        with:
          # No Rust: every addon, Linux's included, comes from the test job.
          rust: "false"

      # Before the build: build-native.ts finds them newer than the sources and
      # builds nothing (without them it would fail: there is no cargo here).
      - name: Download native addons
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: dist/bin
          merge-multiple: true

      - name: Build
        env:
          _CH_BUILD_VERSION: ${{ steps.version.outputs.version }}
          _CH_BUILD_RELEASE: ${{ inputs.release }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
        run: pnpm build

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: out
          retention-days: 1

  package:
    name: Package (${{ matrix.artifact }})
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: linux-x64
            target: linux:appimage
            output: CodeHydra-linux-x64.AppImage
          - artifact: darwin-x64
            target: mac:intel
            output: mac
            rename: CodeHydra-darwin-x64
            tar: true
          - artifact: darwin-arm64
            target: mac:arm
            output: mac-arm64
            rename: CodeHydra-darwin-arm64
            tar: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup
        with:
          rust: "false"

      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: out

      - name: Package
        env:
          _CH_BUILD_VERSION: ${{ needs.prepare.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          npm pkg set "version=$_CH_BUILD_VERSION"
          pnpm dist:${{ matrix.target }} -- --publish=never

      - name: Rename artifact
        if: matrix.rename
        run: mv dist/${{ matrix.output }} dist/${{ matrix.rename }}

      - name: Create tar archive
        if: matrix.tar
        run: |
          NAME="${{ matrix.rename || matrix.output }}"
          tar czf "dist/${NAME}.tar.gz" -C dist "$NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.rename || matrix.output }}${{ matrix.tar && '.tar.gz' || '' }}
          path: dist/${{ matrix.rename || matrix.output }}${{ matrix.tar && '.tar.gz' || '' }}
          retention-days: 1
          if-no-files-found: error

      - name: Upload update metadata
        if: matrix.artifact == 'linux-x64'
        uses: actions/upload-artifact@v7
        with:
          name: update-metadata-${{ matrix.artifact }}
          path: dist/latest*.yml
          retention-days: 1
          if-no-files-found: warn

  # Windows packaging runs on a Windows runner rather than under Wine on Linux.
  # electron-builder needs Wine on Linux only to run rcedit.exe, which stamps the
  # icon and version metadata onto electron.exe; makensis itself runs natively.
  # Installing Wine cost 2m36s per job even on a warm apt cache, for a one-second
  # operation. Native NSIS is also closer to what ships.
  #
  # Both Windows targets are emitted by a single electron-builder pass, so the app
  # is packed once. Artifact names are unchanged — release.yaml consumes them by
  # name — but the check context is now "Package (win-x64)".
  package-windows:
    name: Package (win-x64)
    needs: prepare
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup
        with:
          rust: "false"

      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: out

      - name: Package
        env:
          _CH_BUILD_VERSION: ${{ needs.prepare.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          npm pkg set "version=$_CH_BUILD_VERSION"
          pnpm dist:win -- --publish=never

      - name: Rename portable artifact
        run: mv dist/win-unpacked dist/CodeHydra-win-portable-x64

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: CodeHydra-win-installer-x64.exe
          path: dist/CodeHydra-win-installer-x64.exe
          retention-days: 1
          if-no-files-found: error

      - name: Upload portable
        uses: actions/upload-artifact@v7
        with:
          name: CodeHydra-win-portable-x64
          path: dist/CodeHydra-win-portable-x64
          retention-days: 1
          if-no-files-found: error

      - name: Upload update metadata
        uses: actions/upload-artifact@v7
        with:
          name: update-metadata-win-installer-x64
          path: dist/latest*.yml
          retention-days: 1
          if-no-files-found: warn
