# GENERATED by the ssh-runner skill from .ssh-runner.yml — do not edit.
# Run `ssh-runner init --update` after changing the config, then commit and push:
# the workflow that runs is the one on GitHub, not the one in your working tree.
# ssh-runner-template: 7
# ssh-runner-config: 108d56a63a23f80d
name: ssh-runner windows
run-name: ssh-runner windows ${{ inputs.session_id }}

# Input names use underscores, NOT the config's hyphens: GitHub expressions parse
# `inputs.runs-on` as a subtraction, so a hyphenated input needs inputs['runs-on'].
on:
  workflow_dispatch:
    inputs:
      ssh_pubkey:
        description: SSH PUBLIC key authorized on the runner. Safe to pass; a pubkey is public.
        required: true
        type: string
      session_id:
        description: Correlates this run with the client's session.
        required: true
        type: string
      runs_on:
        description: Runner image.
        required: false
        default: "windows-2025"
        type: string
      stop_after:
        description: Hard maximum session length, minutes.
        required: false
        default: "120"
        type: string
      idle_timeout:
        description: Close after this many minutes with no ssh connection.
        required: false
        default: "30"
        type: string

permissions:
  contents: read

jobs:
  ssh-runner:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Install the Claude CLI
        uses: ./.github/actions/install-claude

      - name: Start sshd and the cloudflared tunnel
        shell: pwsh
        env:
          SSH_PUBKEY: ${{ inputs.ssh_pubkey }}
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'ssh-runner'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $port = 2222
          $git  = 'C:\Program Files\Git\bin\bash.exe'

          # OpenSSH Server is an optional capability on the image. Unlike Unix, sshd cannot run unprivileged
          # on Windows -- it must create a token for the target user -- so it runs as a service.
          $cap = Get-WindowsCapability -Online | Where-Object { $_.Name -like 'OpenSSH.Server*' } | Select-Object -First 1
          if ($cap -and $cap.State -ne 'Installed') { Add-WindowsCapability -Online -Name $cap.Name | Out-Null }

          # Start once so C:\ProgramData\ssh and its host keys exist, then reconfigure and restart.
          Start-Service sshd
          Stop-Service sshd

          $cfg = "Port $port`nPasswordAuthentication no`nPubkeyAuthentication yes`nAuthorizedKeysFile .ssh/authorized_keys`nSubsystem sftp sftp-server.exe`nMatch Group administrators`n       AuthorizedKeysFile __PROGRAMDATA__/ssh/administrators_authorized_keys`n"
          Set-Content -Path "$env:ProgramData\ssh\sshd_config" -Value $cfg -Encoding ascii

          # THE WINDOWS TRAP: the runner user is in the Administrators group, and for such users sshd ignores
          # ~/.ssh/authorized_keys entirely, reading this file instead -- and REFUSES it if anyone beyond
          # Administrators and SYSTEM can read it, which is what the icacls line is for.
          $akf = "$env:ProgramData\ssh\administrators_authorized_keys"
          Set-Content -Path $akf -Value $env:SSH_PUBKEY -Encoding ascii
          icacls $akf /inheritance:r /grant 'Administrators:F' /grant 'SYSTEM:F' | Out-Null

          # Land ssh sessions in Git-bash rather than cmd, so heredocs, touch, the wrapper script and scp
          # paths behave as on the other two OSes. DefaultShellCommandOption matters as much as DefaultShell:
          # without it sshd passes cmd's /c, which bash does not understand.
          New-ItemProperty -Path 'HKLM:\SOFTWARE\OpenSSH' -Name DefaultShell -Value $git -PropertyType String -Force | Out-Null
          New-ItemProperty -Path 'HKLM:\SOFTWARE\OpenSSH' -Name DefaultShellCommandOption -Value '-c' -PropertyType String -Force | Out-Null

          Start-Service sshd

          # Prove sshd is listening before publishing a descriptor: cloudflared will happily tunnel to a dead
          # port, so a dead sshd is otherwise invisible until the client times out.
          $listening = $false
          foreach ($i in 1..20) {
            if ((Test-NetConnection -ComputerName 127.0.0.1 -Port $port -WarningAction SilentlyContinue).TcpTestSucceeded) { $listening = $true; break }
            Start-Sleep -Milliseconds 500
          }
          if (-not $listening) {
            Write-Host '::error::sshd is not listening'
            Get-Service sshd | Format-List | Out-String | Write-Host
            exit 1
          }

          # rsync is absent from Git-bash. MSYS2 ships on the image and its rsync.exe loads its runtime from
          # its own directory, so it works from a Git-bash shell. Non-fatal: exec still works without it.
          try { & C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed rsync 2>&1 | Out-String | Write-Host }
          catch { Write-Host "::warning::could not install rsync from MSYS2" }

          # The stop script and PATH line are written BY bash, so the quoting is bash's own rather than
          # PowerShell's guess at it. __WORK__ is substituted first because the path must be POSIX.
          $posix = ($work -replace '\\','/') -replace '^([A-Za-z]):','/$1'
          $setup = @'
          mkdir -p ~/.ssh-runner/bin
          cat > ~/.ssh-runner/bin/stop <<'EOS'
          #!/bin/sh
          touch "__WORK__/stop"
          echo "ssh-runner: session closing"
          EOS
          chmod +x ~/.ssh-runner/bin/stop
          grep -q ssh-runner/bin ~/.bashrc 2>/dev/null || echo 'PATH="$HOME/.ssh-runner/bin:$PATH:/c/msys64/usr/bin"' >> ~/.bashrc
          '@ -replace '__WORK__', $posix
          Set-Content -Path "$work\setup.sh" -Value $setup -Encoding ascii
          & $git -lc "bash $posix/setup.sh"

          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe' -OutFile "$work\cloudflared.exe"
          # 127.0.0.1, not localhost: localhost can resolve to ::1 first, and the readiness probe only
          # proved the IPv4 bind. Pointing the tunnel at the socket we verified removes the ambiguity.
          # Start cloudflared DETACHED, and force http2 over the default quic (see the Unix script for the
          # measurement). Detached because with Start-Process the log stopped dead at the step boundary;
          # Win32_Process.Create is owned by the WMI service instead, so the process is still alive at the
          # hold step, which is what nohup+disown achieves on Unix.
          $cmdFile = "$work\tunnel.cmd"
          Set-Content -Path $cmdFile -Encoding ascii -Value "@echo off`r`n""$work\cloudflared.exe"" tunnel --no-autoupdate --protocol http2 --url tcp://127.0.0.1:$port > ""$work\cf.out"" 2> ""$work\cf.log"""
          $spawn = ([WMICLASS]'root\cimv2:Win32_Process').Create("cmd.exe /c `"$cmdFile`"")
          if ($spawn.ReturnValue -ne 0) { Write-Host "::error::could not start cloudflared (WMI $($spawn.ReturnValue))"; exit 1 }

          $found = ''
          foreach ($i in 1..90) {
            if (Test-Path "$work\cf.log") {
              $m = Select-String -Path "$work\cf.log" -Pattern 'https://[a-z0-9-]+\.trycloudflare\.com' -AllMatches | Select-Object -First 1 -ExpandProperty Matches
              if ($m) { $found = $m[0].Value -replace '^https://',''; break }
            }
            Start-Sleep -Seconds 1
          }
          if (-not $found) {
            Write-Host '::error::cloudflared produced no hostname'
            Get-Content "$work\cf.log" -ErrorAction SilentlyContinue | Write-Host
            exit 1
          }

          # The client must get a path its shell understands, so the workspace is published in POSIX form.
          $ws = (& 'C:\Program Files\Git\usr\bin\cygpath.exe' -u $env:GITHUB_WORKSPACE).Trim()
          $pub = (Get-Content "$env:ProgramData\ssh\ssh_host_ed25519_key.pub" -Raw).Trim()
          $hostKey = (($pub -split ' ')[0..1]) -join ' '

          @{ host = $found; port = $port; user = $env:USERNAME; os = 'windows'; run_id = $env:GITHUB_RUN_ID; host_key = $hostKey; workspace = $ws } |
            ConvertTo-Json | Set-Content -Path "$work\session.json" -Encoding ascii

          Write-Host "ssh-runner session ready on $found"

      - name: Publish the session descriptor
        uses: actions/upload-artifact@v4
        with:
          name: session-${{ inputs.session_id }}
          path: ${{ runner.temp }}/ssh-runner/session.json
          retention-days: 1

      - name: Hold the session open
        shell: pwsh
        env:
          STOP_AFTER: ${{ inputs.stop_after }}
          IDLE_TIMEOUT: ${{ inputs.idle_timeout }}
        run: |
          $ErrorActionPreference = 'Continue'
          $work = Join-Path $env:RUNNER_TEMP 'ssh-runner'
          $end  = (Get-Date).AddMinutes([int]$env:STOP_AFTER)
          $idle = [int]$env:IDLE_TIMEOUT
          $last = Get-Date

          $alive = @(Get-Process cloudflared -ErrorAction SilentlyContinue).Count
          Write-Host "cloudflared processes alive at hold: $alive"
          Write-Host "Session open. Run stop over ssh to end it; idle $idle min; hard max $env:STOP_AFTER min."
          while ($true) {
            if (Test-Path "$work\stop") { Write-Host 'Ending: stop requested.'; break }
            if ((Get-Date) -ge $end)    { Write-Host 'Ending: stop-after reached.'; break }
            $n = @(Get-NetTCPConnection -LocalPort 2222 -State Established -ErrorAction SilentlyContinue).Count
            if ($n -gt 0) { $last = Get-Date }
            if (((Get-Date) - $last).TotalMinutes -ge $idle) { Write-Host 'Ending: idle timeout.'; break }
            Start-Sleep -Seconds 5
          }

          Stop-Process -Name cloudflared -Force -ErrorAction SilentlyContinue
          Stop-Service sshd -Force -ErrorAction SilentlyContinue

      - name: Transport logs
        if: always()
        shell: pwsh
        run: |
          Write-Host '--- sshd.log ---'
          Get-Content "$env:ProgramData\ssh\logs\sshd.log" -Tail 40 -ErrorAction SilentlyContinue | Write-Host
          Write-Host '--- listening sockets ---'
          netstat -an | Select-String ':2222' | Write-Host
          Write-Host '--- cloudflared.log ---'
          Get-Content "$env:RUNNER_TEMP\ssh-runner\cf.log" -Tail 60 -ErrorAction SilentlyContinue | Write-Host
